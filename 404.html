<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — DAVFOOR LEGEND</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon-32.png" type="image/png">
<style>
  :root{--bg:#0a0a0a;--green:#3fe167;--txt:#fff;--muted:#9aa0a6;--line:#282828}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  img{height:40px;margin-bottom:26px}
  .code{font-size:90px;font-weight:900;line-height:1;color:var(--green);letter-spacing:-2px}
  h1{font-size:22px;margin:14px 0 8px;text-transform:uppercase;letter-spacing:.5px}
  p{color:var(--muted);font-size:15px;max-width:360px;margin:0 auto 26px;line-height:1.5}
  .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  a{text-decoration:none;font-weight:800;border-radius:30px;padding:13px 24px;font-size:14px;text-transform:uppercase;letter-spacing:.4px}
  .primary{background:var(--green);color:#04240f}
  .ghost{background:none;border:1px solid var(--line);color:#fff}
</style>
</head>
<body>
  <img src="assets/img/logo-white.png" alt="DAVFOOR LEGEND" onerror="this.style.display='none'">
  <div class="code">404</div>
  <h1>Página no encontrada</h1>
  <p>Ups, esta página no existe o se movió. Pero tenemos muchas camisetas esperándote. ⚽</p>
  <div class="btns">
    <a class="primary" href="/">Ir al inicio</a>
    <a class="ghost" href="/catalogo?cat=club">Ver camisetas</a>
  </div>
</body>
</html>
