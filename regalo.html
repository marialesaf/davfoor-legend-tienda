  .hero{text-align:center;padding:40px 0 0;position:relative}
  .crest{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-weight:600;font-size:17px;margin-bottom:6px}
  .names{font-family:'Great Vibes',cursive;font-size:clamp(44px,13vw,64px);color:var(--accent);line-height:1}
  .names-sub{font-weight:600;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .heroPhoto{margin:22px auto 0;border-radius:14px;overflow:hidden;max-width:420px}
  .heroPhoto img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover}

  /* MÚSICA */
  .musica{text-align:center;position:relative}
  .disc{width:210px;height:210px;border-radius:50%;margin:0 auto;position:relative;overflow:hidden;
    box-shadow:0 10px 30px rgba(80,20,20,.25),inset 0 0 0 6px rgba(255,255,255,.15);background:#2a1418}
  .disc img{width:100%;height:100%;object-fit:cover}
  .disc .hole{position:absolute;top:50%;left:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 4px rgba(0,0,0,.15)}
  .disc.spin{animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .player{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px}
  .playbtn{flex:0 0 auto;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .wave{display:flex;align-items:center;gap:3px;height:40px}
  .wave span{display:block;width:3px;height:8px;background:var(--accent);border-radius:3px}
  .wave.playing span{animation:wv .9s ease-in-out infinite}
  @keyframes wv{0%,100%{height:8px}50%{height:34px}}

  /* GALERÍA (carrusel) */
  .carrusel{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
  .carrusel::-webkit-scrollbar{display:none}
  .carrusel{scrollbar-width:none}
  .carrusel .slide{flex:0 0 78%;scroll-snap-align:center;border-radius:14px;overflow:hidden}
  .carrusel .slide img{width:100%;height:360px;display:block;object-fit:cover}
  .dots{display:flex;justify-content:center;gap:7px;margin-top:4px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.2s}
  .dots i.on{background:var(--accent);width:20px;border-radius:4px}

  /* CARTA */
  .carta{font-size:16.5px;line-height:1.95;color:var(--accent);text-align:center;white-space:pre-wrap}

  /* CONTADOR */
  .cardrojo{background:var(--accent);color:#fff;border-radius:22px;padding:34px 24px;text-align:center}
  .cardrojo .num{font-weight:700;font-size:clamp(46px,16vw,70px);line-height:1}
  .cardrojo .d{font-weight:600;font-size:17px;letter-spacing:3px;text-transform:uppercase;margin-top:6px}
  .cardrojo .s{font-weight:300;font-size:14px;opacity:.9;margin-top:4px}
  .inicio{text-align:center;font-weight:600;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-top:18px}

  /* TIMELINE */
  .tl{position:relative;padding-left:26px;margin-top:10px}
  .tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1.5px;background:var(--accent)}
  .tl .ev{position:relative;padding:0 0 30px}
  .tl .ev:last-child{padding-bottom:0}
  .tl .ev::before{content:"";position:absolute;left:-26px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .tl .ev .f{font-weight:600;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
  .tl .ev .st{font-weight:400;font-size:13px;color:var(--muted);margin-bottom:12px}
  .polaroid{background:#fff;padding:12px 12px 36px;box-shadow:0 12px 26px rgba(80,20,20,.16);display:inline-block;transform:rotate(-1.5deg)}
  .polaroid img{display:block;width:230px;height:290px;object-fit:cover}

  /* LUGARES */
  .lugar{text-align:center;padding:14px 0;border-bottom:1px solid var(--line)}
  .lugar:last-child{border-bottom:0}
  .lugar .n{font-weight:600;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
  .lugar .f{font-size:12px;color:var(--muted);margin:2px 0 8px}
  .btn-ac{display:inline-block;background:var(--accent);color:#fff;font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;text-decoration:none;border:0;border-radius:30px;padding:10px 22px;cursor:pointer}

  /* VOZ */
  .voz audio{width:100%;margin-top:4px}

  /* SORPRESA / QUIZ */
  .sorpresa{text-align:center}
  .sorpresa p{color:var(--muted);font-size:14px}
  .rev{background:var(--accent);color:#fff;font-weight:600;font-size:13px;letter-spacing:.5px;text-transform:uppercase;border:0;border-radius:30px;padding:14px 28px;cursor:pointer;margin-top:12px}
  .txt{display:none;margin-top:16px;font-size:17px;line-height:1.8;color:var(--accent);white-space:pre-wrap;animation:fade .6s ease}
  .txt.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .quiz{text-align:left;margin:14px 0 4px}
  .quiz .q{margin-bottom:18px}
  .quiz .q .qt{font-weight:600;font-size:14px;color:var(--accent);margin-bottom:9px}
  .quiz .opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 15px;margin-bottom:8px;cursor:pointer;font-family:inherit;font-size:14px;transition:.15s}
  .quiz .opt.sel{border-color:var(--accent);background:#fff4f2}
  .quiz .opt.ok{border-color:#2e8b4f;background:#eafaf0}
  .quiz .opt.bad{border-color:#c0392b;background:#fdeceb}
  .quiz-msg{font-size:14px;margin:6px 0 10px;min-height:18px;color:var(--accent)}

  /* CIERRE */
  .cierre{position:relative;margin:46px -22px 0;height:420px;overflow:hidden}
  .cierre img{width:100%;height:100%;object-fit:cover}
  .cierre .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(40,8,10,.75) 0%,rgba(40,8,10,.15) 55%,transparent 100%)}
  .cierre .txt2{position:absolute;left:0;right:0;bottom:36px;text-align:center;color:#fff;z-index:2}
  .cierre .txt2 .nm{font-family:'Great Vibes',cursive;font-size:clamp(40px,12vw,58px);line-height:1}
  .cierre .txt2 .sb{font-weight:600;font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-top:6px;opacity:.95}

  footer{text-align:center;margin-top:30px;color:var(--muted);font-size:12px}
  footer b{color:var(--accent);font-weight:600}

  /* Lightbox */
  .lb{position:fixed;inset:0;background:rgba(40,12,14,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:90vh;border-radius:12px}
  .lb .x{position:absolute;top:16px;right:22px;font-size:34px;color:#fff;cursor:pointer;line-height:1}

  .loading,.err{text-align:center;padding:90px 20px;color:var(--muted)}
  .err h1{font-family:'Great Vibes',cursive;font-size:44px;color:var(--accent);margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Abriendo tu regalo… 💌</div>
</div>

<div class="lb" id="lb" onclick="this.classList.remove('on')"><span class="x">&times;</span><img id="lbImg" alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script>
  const TEMAS = {
    'madrid':      {crest:'RM',  accent:'#0a3d7a', accent2:'#c9a227', muted:'#6f86a8'},
    'barcelona':   {crest:'FCB', accent:'#7a0b35', accent2:'#1a4a8a', muted:'#b06b84'},
    'millonarios': {crest:'MFC', accent:'#00387a', accent2:'#2f6ea8', muted:'#6b84a8'},
    'nacional':    {crest:'AN',  accent:'#0a6b34', accent2:'#2e8b4f', muted:'#6ba882'},
    'santafe':     {crest:'ISF', accent:'#b00f24', accent2:'#d3122a', muted:'#c07b84'},
    'argentina':   {crest:'ARG', accent:'#2f6ea8', accent2:'#5b9bd0', muted:'#7ba0c0'},
    'portugal':    {crest:'POR', accent:'#9c0a22', accent2:'#0a6b34', muted:'#c07b84'},
    'romantica-1': {crest:'',    accent:'#c23a6b', accent2:'#e07ba0', muted:'#cf8fa8'},
    'romantica-2': {crest:'',    accent:'#8e1414', accent2:'#a8443b', muted:'#b06b5e'},
    'romantica-3': {crest:'',    accent:'#8a6f52', accent2:'#b4916a', muted:'#b39a80'}
  };

  const sb = (typeof supabase!=='undefined' && typeof SUPABASE_URL!=='undefined' && !SUPABASE_URL.includes('TU-PROYECTO'))
    ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  const esc = s => (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // Adornos (líneas y flores) en el color del tema
  const SWIRL = `<svg viewBox="0 0 120 180" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" width="90">
    <path d="M14 12 C86 20 112 64 70 84 C42 97 52 52 82 58 C120 66 108 134 42 142 C24 145 14 152 18 172"/>
    <path d="M82 58 c10 -4 19 1 24 8"/></svg>`;
  const FLORAL = `<svg viewBox="0 0 80 170" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" width="56">
    <path d="M42 170 C42 128 42 96 46 60"/>
    <path d="M46 62 c-11 -7 -16 -20 -12 -31 c11 5 17 18 12 31"/>
    <path d="M46 78 c13 -5 24 3 28 13 c-13 3 -24 -3 -28 -13"/>
    <path d="M44 98 c-13 -3 -24 6 -27 16 c13 1 24 -5 27 -16"/>
    <path d="M45 118 c13 -3 22 6 25 15 c-12 2 -22 -5 -25 -15"/>
    <circle cx="40" cy="30" r="3.4"/><path d="M40 30 c-7 -6 -5 -16 2 -20 c5 7 3 15 -2 20"/>
    <path d="M40 30 c7 -6 16 -3 20 4 c-7 5 -15 3 -20 -4"/></svg>`;

  function aplicarTema(slug){
    const t = TEMAS[slug] || TEMAS['romantica-2'];
    const r = document.documentElement.style;
    r.setProperty('--accent', t.accent);
    r.setProperty('--accent2', t.accent2);
    r.setProperty('--muted', t.muted);
    return t;
  }

  function embedCancion(url){
    if(!url) return '';
    url = url.trim(); let m;
    if(/open\.spotify\.com/.test(url)){
      m = url.match(/track\/([A-Za-z0-9]+)/);
      if(m) return `<iframe style="width:100%;height:152px;border:0;border-radius:14px" src="https://open.spotify.com/embed/track/${m[1]}" allow="encrypted-media" loading="lazy"></iframe>`;
      m = url.match(/playlist\/([A-Za-z0-9]+)/);
      if(m) return `<iframe style="width:100%;height:352px;border:0;border-radius:14px" src="https://open.spotify.com/embed/playlist/${m[1]}" allow="encrypted-media" loading="lazy"></iframe>`;
    }
    m = url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
    if(m) return `<iframe style="width:100%;height:220px;border:0;border-radius:14px" src="https://www.youtube.com/embed/${m[1]}" allow="encrypted-media" allowfullscreen loading="lazy"></iframe>`;
    return ''; // nunca redirigir fuera de la web
  }

  function diasJuntos(fini){
    if(!fini) return null;
    const ini = new Date(fini); if(isNaN(ini)) return null;
    const dias = Math.floor((Date.now()-ini.getTime())/86400000);
    return dias>=0 ? dias : null;
  }
  const head = (sm,big,left)=>`<div class="shead${left?' left':''}">${sm?`<div class="lbl-sm">${sm}</div>`:''}<div class="lbl-big">${big}</div></div>`;

  function render(d){
    const t = aplicarTema(d.tema);
    const fotos = Array.isArray(d.fotos)? d.fotos : [];
    const fechas = Array.isArray(d.fechas)? d.fechas : [];
    const lugares = Array.isArray(d.lugares)? d.lugares : [];
    const dias = diasJuntos(d.fecha_inicio);
    const heroFoto = d.foto_portada || fotos[0] || '';
    const cierreFoto = d.foto_cierre || (fotos.length>1 ? fotos[fotos.length-1] : '');
    // La galería muestra todas las fotos (si la portada vino de la galería, se quita esa).
    const galeria = d.foto_portada ? fotos : fotos.slice(1);

    // 1) PORTADA
    let html = `<div class="hero"><span class="deco d-swirl1" style="top:0;right:-26px"></span>
      ${t.crest?`<div class="crest">${esc(t.crest)}</div>`:''}
      <div class="names">${esc(d.titulo)||'Para ti'}</div>
      ${d.subtitulo?`<div class="names-sub">${esc(d.subtitulo)}</div>`:''}
      ${heroFoto?`<div class="heroPhoto"><img src="${esc(heroFoto)}" alt="" onclick="abrirFoto('${esc(heroFoto)}')"></div>`:''}
    </div>`;

    // 2) MÚSICA (disco que gira + onda)
    if(d.cancion_audio || d.cancion){
      html += `<div class="sec musica"><span class="deco d-swirl2" style="top:4px;left:-28px"></span><div class="lbl-sm" style="margin-bottom:20px">Nuestra canción</div>
        <div class="disc" id="disc">${heroFoto?`<img src="${esc(heroFoto)}" alt="">`:''}<span class="hole"></span></div>`;
      if(d.cancion_audio){
        html += `<div class="player"><button class="playbtn" id="playBtn" aria-label="Reproducir">▶</button>
          <div class="wave" id="wave">${Array.from({length:32}).map(()=>'<span></span>').join('')}</div></div>
          <audio id="song" src="${esc(d.cancion_audio)}" preload="none"></audio>`;
      } else {
        html += `<div style="margin-top:18px">${embedCancion(d.cancion)}</div>`;
      }
      html += `</div>`;
    }

    // 3) GALERÍA (carrusel)
    if(galeria.length){
      html += `<div class="sec">${head('Galería','Momentos que no se olvidan')}
        <div class="carrusel" id="carrusel">${galeria.map(u=>`<div class="slide"><img src="${esc(u)}" alt="" onclick="abrirFoto('${esc(u)}')"></div>`).join('')}</div>
        <div class="dots" id="dots">${galeria.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div></div>`;
    }

    // 4) CARTA
    if(d.mensaje){
      html += `<div class="sec" style="position:relative"><span class="deco d-swirl1" style="top:-6px;right:-26px;transform:scaleX(-1)"></span>${head('Carta','Desde mi ❤️',true)}<div class="carta">${esc(d.mensaje)}</div></div>`;
    }

    // 5) CONTADOR
    if(dias!==null){
      html += `<div class="sec">${head('Recuerdos','Nuestra línea de tiempo')}
        <div class="cardrojo"><div class="num">${dias.toLocaleString('es-CO')}</div><div class="d">Días juntos</div><div class="s">Y los que nos faltan ❤️</div></div>
        ${d.lugar_inicio?`<div class="inicio">📍 Todo empezó en ${esc(d.lugar_inicio)}</div>`:''}</div>`;
    }

    // 6) LÍNEA DE TIEMPO (polaroids)
    if(fechas.length){
      html += `<div class="sec" style="position:relative">
        <span class="deco d-flower" style="top:8px;left:-24px"></span>
        <span class="deco d-flower" style="bottom:24px;right:-16px;transform:scaleX(-1)"></span>
        <div class="tl">${
          fechas.map(f=>`<div class="ev">${f.fecha?`<div class="f">📅 ${esc(f.fecha)}</div>`:''}${f.titulo?`<div class="st">${esc(f.titulo)}</div>`:''}${f.foto?`<div class="polaroid"><img src="${esc(f.foto)}" alt="" onclick="abrirFoto('${esc(f.foto)}')"></div>`:''}${f.desc?`<div class="st" style="margin-top:10px">${esc(f.desc)}</div>`:''}</div>`).join('')
        }</div></div>`;
    }

    // 7) MENSAJE DE VOZ
    if(d.voz){
      html += `<div class="sec voz">${head('','Un mensaje de voz')}<audio controls src="${esc(d.voz)}"></audio></div>`;
    }

    // 8) LUGARES
    if(lugares.length){
      html += `<div class="sec">${head('','El mapa de nuestra historia')}${
        lugares.map(l=>`<div class="lugar"><div class="n">${esc(l.nombre)}</div>${l.fecha?`<div class="f">${esc(l.fecha)}</div>`:''}${l.desc?`<div class="f" style="text-transform:none;font-size:14px;color:var(--ink)">${esc(l.desc)}</div>`:''}<a class="btn-ac" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.nombre||'')}" target="_blank" rel="noopener">Abrir mapa</a></div>`).join('')
      }</div>`;
    }

    // 9) SORPRESA + QUIZ
    const preguntas = Array.isArray(d.preguntas)? d.preguntas.filter(p=>p && p.pregunta) : [];
    window._preguntas = preguntas;
    if(d.sorpresa){
      let s = `<div class="sec sorpresa">${head('','Una última sorpresa')}<p>Pensabas que el regalo había terminado…</p>`;
      if(preguntas.length){
        s += `<p>Responde bien para desbloquearla 👇</p><div class="quiz" id="quiz">${
          preguntas.map((p,qi)=>`<div class="q"><div class="qt">${qi+1}. ${esc(p.pregunta)}</div>${
            (p.opciones||[]).map((o,oi)=>`<button type="button" class="opt" data-q="${qi}" data-o="${oi}" onclick="elegirOpt(${qi},${oi})">${esc(o)}</button>`).join('')
          }</div>`).join('')
        }</div><div class="quiz-msg" id="quizMsg"></div>
        <button class="rev" id="revBtn" onclick="checarQuiz()">Desbloquear sorpresa 🔓</button>
        <div class="txt" id="sorpresaTxt">${esc(d.sorpresa)}</div>`;
      } else {
        s += `<button class="rev" onclick="this.nextElementSibling.classList.add('on');this.style.display='none'">Descubre la sorpresa</button><div class="txt">${esc(d.sorpresa)}</div>`;
      }
      html += s + `</div>`;
    }

    // 10) CIERRE (foto grande con nombres)
    if(cierreFoto){
      const cnm = d.cierre_titulo || d.titulo || '';
      const csb = d.cierre_sub || d.subtitulo || '';
      html += `<div class="cierre"><img src="${esc(cierreFoto)}" alt=""><div class="ov"></div>
        <div class="txt2">${cnm?`<div class="nm">${esc(cnm)}</div>`:''}${csb?`<div class="sb">${esc(csb)}</div>`:''}</div></div>`;
    }

    html += `<footer>Hecho con ❤️ por <b>DAVFOOR LEGEND</b></footer>`;
    document.getElementById('app').innerHTML = html;
    document.title = (d.titulo||'Un regalo') + ' · DAVFOOR LEGEND';
    initMusica();
    initCarrusel();
  }

  function abrirFoto(u){ document.getElementById('lbImg').src=u; document.getElementById('lb').classList.add('on'); }

  // Disco + reproductor
  function initMusica(){
    const btn=document.getElementById('playBtn'), audio=document.getElementById('song'),
          disc=document.getElementById('disc'), wave=document.getElementById('wave');
    if(!btn||!audio) return;
    btn.onclick=()=>{ if(audio.paused) audio.play(); else audio.pause(); };
    audio.onplay=()=>{ btn.textContent='❚❚'; disc.classList.add('spin'); wave.classList.add('playing'); };
    audio.onpause=()=>{ btn.textContent='▶'; disc.classList.remove('spin'); wave.classList.remove('playing'); };
    audio.onended=()=>{ btn.textContent='▶'; disc.classList.remove('spin'); wave.classList.remove('playing'); };
    // retraso aleatorio en cada barra de la onda
    wave.querySelectorAll('span').forEach(s=>s.style.animationDelay=(Math.random()*0.8).toFixed(2)+'s');
  }

  // Carrusel con puntos + auto-avance
  function initCarrusel(){
    const car=document.getElementById('carrusel'); if(!car) return;
    const dots=[...document.querySelectorAll('#dots i')]; const slides=[...car.children];
    let idx=0;
    // Mueve SOLO el carrusel (horizontal), nunca la página.
    const ir=i=>{ idx=(i+slides.length)%slides.length; const s=slides[idx]; car.scrollTo({left: s.offsetLeft-(car.clientWidth-s.clientWidth)/2, behavior:'smooth'}); };
    car.addEventListener('scroll',()=>{
      const c=car.scrollLeft+car.clientWidth/2; let best=0,bd=1e9;
      slides.forEach((s,i)=>{const d=Math.abs(s.offsetLeft+s.clientWidth/2-c); if(d<bd){bd=d;best=i;}});
      idx=best; dots.forEach((x,i)=>x.classList.toggle('on',i===best));
    },{passive:true});
    dots.forEach((d,i)=>d.addEventListener('click',()=>ir(i)));
    // Auto-avance suave, solo cuando el carrusel está a la vista.
    if(slides.length>1){
      let visible=true;
      if('IntersectionObserver' in window){
        new IntersectionObserver(es=>{visible=es[0].isIntersecting;},{threshold:.4}).observe(car);
      }
      setInterval(()=>{ if(visible) ir(idx+1); }, 4000);
    }
  }

  // Quiz
  window._resp = {};
  function elegirOpt(qi, oi){
    window._resp[qi] = oi;
    document.querySelectorAll(`.quiz .opt[data-q="${qi}"]`).forEach(b=>{ b.classList.remove('sel','ok','bad'); if(+b.dataset.o===oi) b.classList.add('sel'); });
    document.getElementById('quizMsg').textContent='';
  }
  function checarQuiz(){
    const preguntas = window._preguntas || [];
    let todasBien=true, respondidas=true;
    preguntas.forEach((p,qi)=>{ if(window._resp[qi]===undefined){respondidas=false;return;} if(window._resp[qi]!==p.correcta) todasBien=false; });
    const msg=document.getElementById('quizMsg');
    if(!respondidas){ msg.textContent='Responde todas las preguntas 💕'; return; }
    if(todasBien){
      document.getElementById('quiz').style.display='none';
      document.getElementById('revBtn').style.display='none';
      msg.textContent='¡Correcto! Aquí está tu sorpresa 💝';
      document.getElementById('sorpresaTxt').classList.add('on');
    } else {
      preguntas.forEach((p,qi)=>{ const sel=window._resp[qi]; if(sel!==undefined && sel!==p.correcta){ const b=document.querySelector(`.quiz .opt[data-q="${qi}"][data-o="${sel}"]`); if(b){b.classList.remove('sel');b.classList.add('bad');} } });
      msg.textContent='¡Casi! Revisa las respuestas en rojo e inténtalo otra vez 😊';
    }
  }

  async function cargar(){
    const id = new URLSearchParams(location.search).get('id');
    const app = document.getElementById('app');
    if(!id){ app.innerHTML='<div class="err"><h1>Regalo no encontrado</h1><p>El enlace no es válido.</p></div>'; return; }
    if(!sb){ app.innerHTML='<div class="err"><h1>Un momento…</h1><p>No se pudo conectar. Intenta de nuevo.</p></div>'; return; }
    const {data, error} = await sb.from('regalos').select('*').eq('id', id).maybeSingle();
    if(error || !data){ app.innerHTML='<div class="err"><h1>Regalo no encontrado 💔</h1><p>Revisa el enlace o el código QR.</p></div>'; return; }
    render(data);
  }
  cargar();
</script>
</body>
</html>
